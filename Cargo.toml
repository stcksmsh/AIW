[package]
name = "aiw"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
description = "Vendor-neutral persistent workspaces for disposable coding agents"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/stcksmsh/AIW"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
