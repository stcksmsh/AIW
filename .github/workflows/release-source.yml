name: Release source
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.93.0
      - run: scripts/package-release.sh --tag "${GITHUB_REF_NAME}" --output-dir release
      - run: scripts/verify-release.sh --tag "${GITHUB_REF_NAME}" --directory release
      - uses: actions/upload-artifact@v4
        with:
          name: aiw-source-${{ github.ref_name }}
          path: release/
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "AIW ${GITHUB_REF_NAME#v}" \
              --notes-file release/RELEASE.txt
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
